# Production: one EC2 instance, four containers, and two AWS services beside
# them. Development is docker-compose.yml at the repository root, which runs
# only Postgres and Redis.
#
#   the database   RDS PostgreSQL, reached over TLS inside the VPC
#   uploaded files an S3 bucket, through the hub — CUCKOO_BLOBS=s3
#   Redis          a container: nothing in it survives a restart by design,
#                  so there is nothing for a managed cache to manage
#
# Every value comes from .env beside this file (start from .env.example).
# `docker compose config` shows the result.
#
# The hub and the welcome agent are images built on a laptop or in CI and
# loaded here by deploy/deploy.sh; nothing is compiled on this machine.
#
# To keep the database and the files on the machine instead — the laptop test,
# or a hub with no AWS behind it — add the overlay:
#
#   docker compose -f compose.yml -f compose.local.yml up -d

name: cuckoo

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  hub:
    image: ${HUB_IMAGE:?set HUB_IMAGE in .env (deploy.sh writes it)}
    restart: unless-stopped
    logging: *logging
    environment:
      CUCKOO_ENV: prod
      CUCKOO_HUB_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CUCKOO_PUBLIC_URL: https://${SITE_DOMAIN}
      CUCKOO_HTTP_ADDR: ":8080"
      # sslmode=require encrypts without checking who answered, which is what
      # a private subnet already settles. verify-full needs the RDS root
      # certificate mounted and named here; see README, "The database".
      CUCKOO_DATABASE_URL: postgres://${DB_USER:-cuckoo}:${DB_PASSWORD:?set DB_PASSWORD in .env}@${DB_HOST:?set DB_HOST in .env}:${DB_PORT:-5432}/${DB_NAME:-cuckoo}?sslmode=${DB_SSLMODE:-require}
      CUCKOO_REDIS_URL: redis://redis:6379/0
      # Where uploaded files go: s3, or disk with the overlay. The keys are
      # the same either way, so changing this is a copy, not a migration.
      CUCKOO_BLOBS: ${CUCKOO_BLOBS:-s3}
      CUCKOO_S3_BUCKET: ${S3_BUCKET:-}
      CUCKOO_S3_REGION: ${AWS_REGION:-}
      CUCKOO_MEDIA_DIR: /data/media
      # console until the first stranger signs in: the code is in
      # `docker compose logs hub`. smtp needs the six settings below.
      CUCKOO_MAIL: ${CUCKOO_MAIL:-console}
      CUCKOO_SMTP_HOST: ${CUCKOO_SMTP_HOST:-}
      CUCKOO_SMTP_PORT: "${CUCKOO_SMTP_PORT:-587}"
      CUCKOO_SMTP_USERNAME: ${CUCKOO_SMTP_USERNAME:-}
      CUCKOO_SMTP_PASSWORD: ${CUCKOO_SMTP_PASSWORD:-}
      CUCKOO_SMTP_FROM: ${CUCKOO_SMTP_FROM:-}
      CUCKOO_SMTP_FROM_NAME: ${CUCKOO_SMTP_FROM_NAME:-Cuckoo}
      CUCKOO_WELCOME_HANDLE: ${WELCOME_HANDLE:-}
      CUCKOO_LOG_LEVEL: ${CUCKOO_LOG_LEVEL:-info}
      CUCKOO_SHUTDOWN_TIMEOUT: 15s
      CUCKOO_RETENTION_DAYS: "${CUCKOO_RETENTION_DAYS:-90}"
      CUCKOO_USER_MEDIA_BUDGET_MB: "${CUCKOO_USER_MEDIA_BUDGET_MB:-100}"
      CUCKOO_AGENT_MEDIA_BUDGET_MB: "${CUCKOO_AGENT_MEDIA_BUDGET_MB:-1024}"
      CUCKOO_RETENTION_DRY_RUN: "${CUCKOO_RETENTION_DRY_RUN:-false}"
      CUCKOO_SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY in .env (openssl rand -hex 32)}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Nothing in Redis needs to survive a restart: stream buffers, rate-limit
    # counters and the live-event bus are all rebuilt from use. That is also
    # why this is a container and not ElastiCache.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      HUB_UPSTREAM: hub:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WWW_DIR:-/srv/www}:/srv/www:ro
      # Certificates. Losing this volume only means fetching them again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub

  # Started only once it exists on the hub and its secret is in .env:
  # set COMPOSE_PROFILES=welcome there (README, "The welcome agent").
  welcome:
    image: ${WELCOME_IMAGE:-cuckoo-welcome:latest}
    profiles: ["welcome"]
    restart: unless-stopped
    logging: *logging
    environment:
      CUCKOO_SECRET: ${WELCOME_SECRET:-}
      CUCKOO_HUB: http://hub:8080
    depends_on:
      - hub

volumes:
  caddy-data:
  caddy-config:
