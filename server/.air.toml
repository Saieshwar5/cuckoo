# Hot reload for `make dev`: save a .go file and the server restarts in about a
# second. Fast feedback is the point of the whole setup.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/cuckoo ./cmd/cuckoo"
  bin = "./tmp/cuckoo"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "internal/store/gen"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000

[log]
  time = false

[misc]
  clean_on_exit = true
